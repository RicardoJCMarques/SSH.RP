[platformio]
default_envs = w55rp20

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool
monitor_speed = 115200
build_flags =
    -DWOLFSSL_USER_SETTINGS
    -Iinclude
    -Ideps/wolfssl
    -Ideps/wolfssh
; misc.c is #included by the other wolfCrypt sources
build_src_filter =
    +<*.cpp>
    +<../deps/wolfssl/wolfcrypt/src/*.c>
    -<../deps/wolfssl/wolfcrypt/src/misc.c>
    +<../deps/wolfssl/wolfcrypt/src/port/rpi_pico/pico.c>
    +<../deps/wolfssh/src/ssh.c>
    +<../deps/wolfssh/src/internal.c>
    +<../deps/wolfssh/src/io.c>
    +<../deps/wolfssh/src/port.c>
    +<../deps/wolfssh/src/ossh.c>
    +<../deps/wolfssh/src/log.c>

[env:w55rp20]
board = wiznet_55rp20_evb_pico
build_flags =
    ${env.build_flags}
    -DTARGET_W55RP20
    -DUSER_LED=19

[env:rp2040_w5500]
board = pico
build_flags =
    ${env.build_flags}
    -DTARGET_RP2040_W5500
    -DUSER_LED=25
    -DW5500_CS_PIN=17
    -DW5500_RST_PIN=20